name: Jamie's Pick baselines (player history, not bet)

# Refreshes each player's normal game for the Jamie's Pick live agent (pbm-jamie).
# Runs after every successful live engine run. Writes only to jamie_baselines.
on:
  workflow_run:
    workflows: ["Play Book Matrix engine"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: pbm-jamie
  cancel-in-progress: true

jobs:
  run:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Player baselines
        run: python -m jamie.baselines
